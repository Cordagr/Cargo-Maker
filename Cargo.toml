[package]
name = "cargo-cmake-bridge"
version = "0.1.0"
edition = "2021"
description = "Cargo subcommand that generates CMake Find<Crate>.cmake files for linking Rust crates into CMake/C++ projects."
license = "MIT"
repository = "https://github.com/Cordagr/Cargo-Maker"
readme = "README.md"
exclude = ["fixtures/*", "examples/*", ".github/*"]

[lib]
name = "cargo_cmake_bridge"
path = "src/lib.rs"

[[bin]]
name = "cargo-cmake-bridge"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.18"   # parse `cargo metadata` output
clap = { version = "4", features = ["derive"] }   # CLI argument parsing
# serde = { version = "1", features = ["derive"] }  # (de)serialization for metadata/config
# serde_json = "1"
anyhow = "1"              # error handling
# handlebars = "5"          # template rendering for .cmake output

[dev-dependencies]
# assert_cmd = "2"
# predicates = "3"
# tempfile = "3"
