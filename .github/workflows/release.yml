name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cargo-cmake-bridge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cargo-cmake-bridge.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cargo-cmake-bridge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../cargo-cmake-bridge-${{ matrix.target }}.zip ${{ matrix.artifact }}
          else
            tar czf ../cargo-cmake-bridge-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-cmake-bridge-${{ matrix.target }}
          path: cargo-cmake-bridge-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
